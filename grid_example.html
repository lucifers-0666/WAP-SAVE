<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grid Layout</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:#f2f2f2;
    font-family:Arial,sans-serif;
}

.container{
    width:900px;
    height:700px;

    display:grid;

    grid-template-columns:150px 1fr 200px;
    grid-template-rows:60px 120px 140px 120px 120px 80px 60px;

    border:2px solid #000;
}

.container div{
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:bold;
    font-size:20px;
    border:1px solid #000;
}

/* Row 1 */

.logo{
    grid-column:1/2;
    grid-row:1;
}

.navbar{
    grid-column:2/3;
    grid-row:1;
}

.search{
    grid-column:3/4;
    grid-row:1;
}

/* Row 2 */

.ads{
    grid-column:1/2;
    grid-row:2;
}

.slider{
    grid-column:2/3;
    grid-row:2;
}

.side1{
    grid-column:3/4;
    grid-row:2;
}

/* Row 3 */

.p1{
    grid-column:1/3;
    grid-row:3;
}

.image1{
    grid-column:3/4;
    grid-row:3;
}

/* Row 4 & 5 */

.content2{
    grid-column:1/3;
    grid-row:4/6;
}

.img3{
    grid-column:3/4;
    grid-row:4;
}

.img4{
    grid-column:3/4;
    grid-row:5;
}

/* Row 6 */

.img5{
    grid-column:1/2;
    grid-row:6;
}

.content3{
    grid-column:2/4;
    grid-row:6;
}

/* Footer */

.footer{
    grid-column:1/4;
    grid-row:7;
}

</style>

</head>
<body>

<div class="container">

<div class="logo">Logo</div>
<div class="navbar">Navbar</div>
<div class="search">Search</div>

<div class="ads">Ads</div>
<div class="slider">Slider</div>
<div class="side1">Side 1</div>

<div class="p1">P1</div>
<div class="image1">Image 1</div>

<div class="content2">Content 2</div>
<div class="img3">Image 3</div>
<div class="img4">Image 4</div>

<div class="img5">Image 5</div>
<div class="content3">Content 3</div>

<div class="footer">Footer</div>

</div>

</body>
</html>
